packages:
  - projects/*

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  es5-ext: true
  esbuild: true
  prisma: true
  unrs-resolver: true
  workerd: true

catalog:
  '@somni/eslint-config': https://github.com/somnisomni/eslint-config.git#main
  '@types/eslint': ^9.6.1
  '@types/node': ^25.5.0
  eslint: ^10.10.0
  typescript: ^6.0.3
  vite: ^8.3.0

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260911.1'
  - autoprefixer@10.5.6
  - miniflare@5.20260910.0-alpha
  - vite@8.3.0
  - wrangler@4.131.0
